[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sater"
version = "0.1.0"
description = "Search for double word squares -- grids where every row and every column is a word."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matt Abate", email = "mabate13@gmail.com" }]
keywords = ["wordplay", "word square", "crossword", "sator", "puzzle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mattabate/sater"
"Word list" = "https://github.com/mattabate/wordlist"

[project.scripts]
sater = "sater.cli:main"

[tool.setuptools]
packages = ["sater"]
